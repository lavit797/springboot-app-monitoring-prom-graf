# ─────────────────────────────────────────────
# Spring Boot Actuator + Prometheus Config
# ─────────────────────────────────────────────

spring.application.name=springboot-app

# Expose actuator endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics,env,loggers
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Prometheus metrics export
management.metrics.export.prometheus.enabled=true

# Tag all metrics with the application name
management.metrics.tags.application=${spring.application.name}

# Enable histogram for percentile calculations (P99, P95, etc.)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# HikariCP connection pool metrics (if using a DB)
# spring.datasource.hikari.register-mbeans=true

# Server port
server.port=8080

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
